name: Installed package and native model smoke test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  programming-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up competition Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and native model dependencies
        run: |
          python -m pip install ".[test,competition]"
          python -m pip check

      - name: Run installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: storesales-forecast --fixture --output-dir store-sales-smoke

      - name: Run tests including real LightGBM integration
        run: python -m pytest --strict-markers tests -q

      - name: Run the CSV programming example
        run: python examples/programming_sample.py --fixture --output-dir results/programming-sample-ci
